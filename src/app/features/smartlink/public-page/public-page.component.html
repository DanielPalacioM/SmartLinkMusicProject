<!-- CARGANDO -->
<div *ngIf="cargando" class="loading-screen">
  <div class="spinner"></div>
</div>

<!-- NO DATA -->
<div *ngIf="!cargando && noData" class="no-data">
  Smartlink no disponible.
</div>

<!-- SMARTLINK -->
<div class="smartlink-container" *ngIf="!cargando && !noData">

  <button class="hamburger" [class.active]="sidebarOpen" (click)="sidebarOpen = !sidebarOpen">
    <span></span><span></span><span></span>
  </button>

  <div class="sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-content">
      <button class="login-btn" routerLink="/login" (click)="sidebarOpen = false">
        <span>👤</span> Iniciar Sesión
      </button>
    </div>
  </div>

  <div class="bg-blur" [style.background-image]="'url(' + cover + ')'"></div>

  <div class="content">
    <div class="top-section">
      <img [src]="cover || 'assets/default-cover.jpg'" class="cover" alt="Portada">

      <div class="info">
        <h2 class="title">{{ title || 'Artista - Canción' }}</h2>
        <p class="subtitle">Elige tu servicio de preferencia</p>

        <div class="buttons">

          <div *ngIf="urls.spotify" class="btn spotify" (click)="abrir(urls.spotify, 'spotify')">
            <img src="assets/spotify.png" class="icon"> Spotify
          </div>

          <div *ngIf="urls.youtube" class="btn youtube" (click)="abrir(urls.youtube, 'youtube')">
            <img src="assets/youtubeRed.png" class="icon"> YouTube
          </div>

          <div *ngIf="urls.facebook" class="btn facebook" (click)="abrir(urls.facebook, 'facebook')">
            <img src="assets/facebookBlue.png" class="icon"> Facebook
          </div>

          <div *ngIf="urls.youtubemusic" class="btn ytmusic" (click)="abrir(urls.youtubemusic, 'youtube_music')">
            <img src="assets/ytmusic.png" class="icon"> YouTube Music
          </div>

        </div>
      </div>
    </div>

    <p class="terms">
      Esta plataforma funciona como un Smart Link que redirige a servicios externos de música.
      No alojamos contenido musical.
    </p>
  </div>

</div>
